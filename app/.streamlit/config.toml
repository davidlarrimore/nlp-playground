[theme]
# Tailwind CSS-inspired color palette
primaryColor = "#3b82f6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#0f172a"
font = "sans serif"

[server]
# Server settings
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
# Browser settings
gatherUsageStats = false

[client]
# Client settings
showErrorDetails = true
toolbarMode = "auto"
showSidebarNavigation = false
